name: Versions epinglees

# Chaque lundi : signale les outils qui epinglent un tag ancien d'une
# bibliotheque, et les bibliotheques dont src/ a change depuis leur dernier tag
# (audit du 10/11/2026, R2). Ouvre ou met a jour une issue, la ferme si tout
# est a jour.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Relever les versions
        run: node scripts/versions.mjs > rapport.txt && cat rapport.txt
      - name: Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const rapport = fs.readFileSync('rapport.txt', 'utf8').trim();
            const titre = 'Versions epinglees a mettre a jour';
            const ouvertes = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open' });
            const issue = ouvertes.find((i) => i.title === titre);
            const aJour = rapport.startsWith('Toutes les versions');
            const corps = `${rapport}\n\n_Releve du ${new Date().toISOString().slice(0, 10)} par le workflow « Versions epinglees »._`;
            if (aJour) {
              if (issue) await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed', body: corps });
            } else if (issue) {
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, body: corps });
            } else {
              await github.rest.issues.create({ ...context.repo, title: titre, body: corps });
            }
