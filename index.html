<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Béton armé · EC2 — Outils de vérification</title>
<style>
  :root{
    /* ---- Chassis ---- */
    --fond:#f7f7f6;             /* fond de page */
    --surface:#ffffff;          /* cartes, panneaux, champs */
    --surface-appui:#f2f1ec;    /* en-tetes de tableau, boutons au repos, blocs d'attente */
    --texte:#1a1a1a;
    --texte-doux:#4a4842;       /* notes, libelles de ligne, corps secondaire */
    --texte-faible:#6a6862;     /* legend, sous-titres, surtitres */
    --bordure:#c8c6c0;          /* filet structurant : cadres, champs, separateurs */
    --bordure-douce:#eceae4;    /* filet interne : lignes de liste, lignes de tableau */

    /* ---- Interface ---- */
    --accent:#1e5aa8;           /* focus, liens, etat actif — JAMAIS une couleur de sens */
    --accent-doux:#eaf1f9;      /* fond d'un champ actif, surlignage de zone */

    /* ---- Couleurs de sens ---- */
    --compression:#2f5d8a;      /* bielle, beton comprime, domaine resistant */
    --traction:#a8442a;         /* tirant, acier tendu, point sollicitant */
    --beton:#e7eaee;            /* aplat de matiere dans les traces */
    --neutre:#9a978f;           /* barre a effort nul, reperes de cotation */

    /* ---- Verdicts : trois etats, pas quatre ---- */
    --ok:#1f6f3f;      --ok-fond:#eaf4ee;
    --alerte:#8a6d00;  --alerte-fond:#fdf6e3;
    --refus:#a52121;   --refus-fond:#f8ecec;

    /* ---- Typographie ---- */
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

    /* ---- Rayons ---- */
    --rayon:4px;                /* cartes, panneaux, fieldsets */
    --rayon-petit:3px;          /* champs, boutons, pastilles */

    color-scheme:light;

    /* ---- Gabarit propre au hub ---- */
    --nav:252px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;color:var(--texte);background:var(--fond);font-family:var(--sans);font-size:14px;line-height:1.5}
  :focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  /* Tout nombre, toute unite : monoespace tabulaire. Le monoespace ne sert
     jamais de police de titre. */
  .field .u,.card .val,.kv,.step,.verdict,table,input[type=number]{
    font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* Surtitres, libelles de panneau, pastilles et boutons : sans, majuscules
     espacees. */
  .eyebrow,.t-eyebrow,.menu-group-lbl,.subh,.tag,.card .k,.tool-card .cat,
  .tool-card .status,.placeholder .big,caption,.step.head,.verdict small,
  button.tool,details.adv summary,details.deriv summary,.panel-h{
    font-family:var(--sans);font-size:.72rem;letter-spacing:.08em;
    text-transform:uppercase;font-weight:600}

  /* ---------- App shell ---------- */
  /*
   * Le volet de navigation est un TIROIR, a toutes les largeurs.
   *
   * Il occupait auparavant une colonne permanente de 252 px sur grand ecran.
   * Un menu de six entrees, qu'on consulte quelques secondes puis plus du
   * tout, n'a pas a retenir un quart de la largeur pendant qu'on saisit. Il
   * s'ouvre donc sur demande, par l'icone a trois barres, et se referme des
   * qu'on a choisi — au clic sur le voile, a la touche Echap, ou en changeant
   * de page.
   */
  .app{display:grid;grid-template-columns:1fr;min-height:100vh}
  aside.nav{
    background:var(--surface);border-right:1px solid var(--bordure);
    position:fixed;left:0;top:0;width:var(--nav);height:100vh;overflow-y:auto;
    display:flex;flex-direction:column;z-index:40;
    /* Ferme, le volet sort AUSSI de l'ordre de tabulation : `visibility`
       fait ce que `transform` seul ne fait pas. */
    transform:translateX(-100%);visibility:hidden;
    transition:transform .2s, visibility .2s;
  }
  body.nav-open aside.nav{transform:translateX(0);visibility:visible}
  .brand{padding:20px 18px 16px;border-bottom:1px solid var(--bordure-douce)}
  .brand .eyebrow{color:var(--texte-faible)}
  .brand .name{font-size:.95rem;font-weight:600;margin-top:3px}
  .brand .desc{font-size:.8rem;color:var(--texte-doux);margin-top:2px}
  nav.menu{padding:10px 0;flex:1}
  .menu-group{padding:12px 18px 4px}
  .menu-group-lbl{color:var(--texte-faible)}
  a.item,span.item{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:8px 18px 8px 16px;font-size:.85rem;color:var(--texte);text-decoration:none;
    border-left:3px solid transparent;cursor:pointer;
  }
  a.item:hover{background:var(--fond)}
  a.item.active{background:var(--accent-doux);border-left-color:var(--accent);color:var(--accent);font-weight:600}
  a.item:focus-visible{outline-offset:-2px}
  span.item.disabled{color:var(--texte-faible);cursor:default}
  .tag{padding:2px 6px;border-radius:var(--rayon-petit);background:var(--surface-appui);
    color:var(--texte-faible);border:1px solid var(--bordure-douce)}
  .nav-foot{padding:14px 18px;border-top:1px solid var(--bordure-douce);font-size:.8rem;color:var(--texte-doux);line-height:1.45}

  main{min-width:0}

  /*
   * La barre du haut porte l'icone du tiroir et l'identite de la suite. Elle
   * reste collee en haut : le menu doit etre atteignable sans remonter la
   * page.
   */
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30;
    background:var(--fond);border-bottom:1px solid var(--bordure);padding:10px 16px}
  .topbar .t-name{font-weight:600;font-size:.95rem}
  .topbar .t-eyebrow{color:var(--texte-faible)}
  .hamb{display:inline-flex;flex-direction:column;gap:3px;background:none;
    border:1px solid var(--bordure);border-radius:var(--rayon-petit);padding:8px 9px;cursor:pointer}
  .hamb:hover{background:var(--surface-appui)}
  .hamb span{width:16px;height:2px;background:var(--texte);display:block}

  /*
   * Le voile n'existe QUE volet ouvert. Sans la regle de base `display:none`,
   * il redevient un div ordinaire, donc une CELLULE de la grille `.app` :
   * il occupait la premiere colonne et repoussait le contenu hors de l'ecran.
   */
  .scrim{display:none;position:fixed;inset:0;background:var(--texte);opacity:.35;z-index:35}
  body.nav-open .scrim{display:block}

  .view-wrap{max-width:1120px;margin:0 auto;padding:0 22px}

  .page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;
    padding:22px 0 16px;border-bottom:1px solid var(--bordure);margin-bottom:22px}
  .page-h .eyebrow{color:var(--texte-faible)}
  .page-h h1{font-size:1.1rem;margin:6px 0 2px;letter-spacing:.02em;font-weight:400}
  .page-h .sub{color:var(--texte-doux);font-size:.8rem}
  .verdict{font-size:.85rem;border-left:3px solid;border-radius:var(--rayon);padding:9px 13px;white-space:nowrap;font-weight:600}
  .verdict small{display:block;font-weight:400;color:inherit}
  .v-ok{color:var(--ok);border-color:var(--ok);background:var(--ok-fond)}
  .v-no{color:var(--refus);border-color:var(--refus);background:var(--refus-fond)}

  /* ---------- Accueil ---------- */
  .hero{padding:8px 0 4px}
  .hero .lead{font-size:.85rem;color:var(--texte);max-width:60ch}
  .toolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin:22px 0}
  .tool-card{display:block;text-decoration:none;color:inherit;border:1px solid var(--bordure);border-radius:var(--rayon);background:var(--surface);padding:16px;position:relative;transition:border-color .15s}
  a.tool-card:hover{border-color:var(--accent)}
  .tool-card .cat{color:var(--texte-faible)}
  .tool-card h3{font-size:.95rem;margin:6px 0 4px;font-weight:600}
  .tool-card p{font-size:.85rem;color:var(--texte-doux);margin:0}
  /* Pastille d'etat : information, pas verdict — donc pas de couleur de sens. */
  .tool-card .status{position:absolute;top:14px;right:14px;padding:2px 6px;border-radius:var(--rayon-petit);
    background:var(--surface-appui);color:var(--texte-faible);border:1px solid var(--bordure-douce)}
  .tool-card.soon{opacity:.85}

  /* ---------- shared building blocks (fissuration) ---------- */
  .grid{display:grid;grid-template-columns:340px 1fr;gap:22px;margin:0 0 22px}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--surface);border:1px solid var(--bordure);border-radius:var(--rayon)}
  .panel-h{color:var(--texte-faible);background:var(--surface-appui);
    border-bottom:1px solid var(--bordure-douce);padding:9px 14px;display:flex;align-items:center;gap:8px}
  .panel-h .num{color:var(--accent)}
  .panel-b{padding:12px 14px}
  .field{display:grid;grid-template-columns:1fr 96px;align-items:center;gap:8px;margin:8px 0;font-size:.85rem}
  .field .u{font-size:.8rem;color:var(--texte-doux);text-align:left;grid-column:2;margin-top:-4px}
  .field.stack{grid-template-columns:1fr}
  input,select{padding:.28rem .4rem;border:1px solid var(--bordure);border-radius:var(--rayon-petit);
    background:var(--surface);color:inherit;font:inherit;width:100%}
  input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;-moz-appearance:textfield}
  select{text-align:left}
  /* Le champ n'est habille d'accent-doux que pendant la saisie. */
  input:focus,select:focus{background:var(--accent-doux)}
  .note{font-size:.8rem;color:var(--texte-doux);margin:2px 0 10px;line-height:1.35}
  .grp{border-top:1px solid var(--bordure-douce);margin-top:6px;padding-top:8px}
  .grp:first-child{border-top:0;margin-top:0;padding-top:0}
  .subh{color:var(--texte-faible);padding:0 0 4px}
  details.adv summary{cursor:pointer;color:var(--texte-faible);padding:6px 0}
  details.adv[open] summary{color:var(--texte)}

  .draw-wrap{background:var(--surface);border:1px solid var(--bordure);border-radius:var(--rayon);margin-bottom:22px}
  .draw-b{padding:6px}
  svg.section{display:block;width:100%;height:auto;background:var(--surface);
    border:1px solid var(--bordure-douce);border-radius:var(--rayon-petit)}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--texte-doux);padding:8px 12px;border-top:1px solid var(--bordure-douce)}
  .legend i{display:inline-block;width:11px;height:11px;margin-right:5px;vertical-align:-1px;border-radius:1px}

  .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  @media(max-width:520px){.cards{grid-template-columns:1fr}}
  .card{border:1px solid var(--bordure);border-radius:var(--rayon);padding:12px 14px;background:var(--surface)}
  .card .k{color:var(--texte-faible)}
  .card .val{font-size:1.1rem;font-weight:600;margin-top:2px;line-height:1.1}
  .card .val small{font-size:.8rem;color:var(--texte-doux);font-weight:400}
  .card .x{font-family:var(--sans);font-size:.8rem;color:var(--texte-doux);margin-top:3px}
  .card.gov{border-color:var(--accent);background:var(--accent-doux)}
  .card.gov .val{color:var(--accent)}

  /* Verdict : lisere gauche de 3px, fond *-fond, texte en couleur pleine. */
  .verif{border:1px solid var(--bordure);border-radius:var(--rayon);overflow:hidden}
  .verif.ok{border-left:3px solid var(--ok)} .verif.no{border-left:3px solid var(--refus)}
  .verif-h{padding:10px 14px;font-size:.85rem;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .verif.ok .verif-h{background:var(--ok-fond);color:var(--ok)}
  .verif.no .verif-h{background:var(--refus-fond);color:var(--refus)}
  .verif-b{padding:6px 14px 12px}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;padding:5px 0;border-bottom:1px solid var(--bordure-douce)}
  .kv:last-child{border-bottom:0}
  .kv .lab{font-family:var(--sans);color:var(--texte-doux)}

  details.deriv{margin-top:14px;background:var(--surface);border:1px solid var(--bordure);border-radius:var(--rayon)}
  details.deriv summary{cursor:pointer;color:var(--texte-faible);padding:11px 14px;list-style:none}
  details.deriv summary::-webkit-details-marker{display:none}
  details.deriv summary::before{content:"▸ ";color:var(--accent)}
  details.deriv[open] summary::before{content:"▾ "}
  .deriv-b{padding:2px 14px 14px;border-top:1px solid var(--bordure-douce)}
  .step{font-size:.85rem;padding:7px 0;border-bottom:1px solid var(--bordure-douce);display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:baseline}
  @media(max-width:600px){.step{grid-template-columns:1fr}}
  .step .sym{color:var(--accent)}
  .step .expr{color:var(--texte-doux);word-break:break-word}
  .step .res{text-align:right;white-space:nowrap}
  .step.head{grid-template-columns:1fr;border-bottom:1px solid var(--bordure);color:var(--texte-faible);margin-top:8px;padding-bottom:4px}

  .ref{margin:22px 0}
  table{border-collapse:collapse;width:100%;font-size:.85rem;background:var(--surface)}
  th,td{border-bottom:1px solid var(--bordure-douce);padding:5px 8px;text-align:center;font-weight:400}
  th{background:var(--surface-appui);color:var(--texte-doux)}
  td.l,th.l{text-align:left}
  caption{text-align:left;color:var(--texte-faible);padding:10px 0 6px}

  .foot{border-top:1px solid var(--bordure);padding:18px 0 40px;color:var(--texte-doux);font-size:.8rem;line-height:1.5;margin-top:22px}
  .foot b{color:var(--texte)}
  .tools{display:flex;gap:10px;margin:0 0 12px;flex-wrap:wrap}
  button.tool{cursor:pointer;padding:.32rem .7rem;border:1px solid var(--bordure);border-radius:var(--rayon-petit);
    background:var(--surface-appui);color:inherit}
  button.tool:hover{background:color-mix(in srgb, var(--surface-appui) 95%, var(--texte))}

  /* Attente : bloc gris, pas un verdict — donc pas de lisere colore. */
  .placeholder{border:1px solid var(--bordure);border-radius:var(--rayon);background:var(--surface-appui);padding:34px 24px;text-align:center;margin:8px 0}
  .placeholder .big{color:var(--texte-faible)}
  .placeholder p{max-width:52ch;margin:10px auto 0;color:var(--texte-doux);font-size:.85rem}

  @media print{
    body{background:#fff}
    .app{grid-template-columns:1fr}
    aside.nav,.topbar,.hamb,.scrim,.tools,button.tool,details.deriv,details.adv{display:none!important}
    input,select{border:0;background:none;padding:0}
  }
  @media(prefers-reduced-motion:no-preference){
    .card .val,.verif,.verdict,.tool-card{transition:.18s}
  }
  @media(prefers-reduced-motion:reduce){
    aside.nav{transition:none}
  }

/* Une valeur forcee hors du domaine physique n'est pas un echec de
   verification : c'est un AVERTISSEMENT. D'ou la couleur d'alerte, jamais
   celle du refus — « une couleur de sens ne sert jamais de decor » vaut
   aussi dans l'autre sens. */
.avert{margin:0 0 12px}
.avert ul{margin:0;padding:10px 14px 10px 28px;list-style:disc;
  background:var(--alerte-fond);border-left:3px solid var(--alerte);
  border-radius:var(--rayon-petit);color:var(--alerte);font-size:.82rem;line-height:1.45}
.avert li+li{margin-top:6px}
</style>
</head>
<body>
<div class="app">
  <div class="scrim" onclick="toggleNav(false)"></div>

  <aside class="nav" id="nav">
    <div class="brand">
      <div class="eyebrow">EC2 · Béton armé</div>
      <div class="name">Outils de vérification</div>
      <div class="desc">Bureau d'études · Eurocode 2</div>
    </div>
    <nav class="menu" id="menu"></nav>
    <div class="nav-foot">
      Calculs exécutés localement, sans transmission de données. EN 1992-1-1:2004 + AC:2010.
    </div>
  </aside>

  <main>
    <div class="topbar">
      <button class="hamb" id="hamb" aria-label="Menu" aria-controls="nav" aria-expanded="false"
              onclick="toggleNav(!document.body.classList.contains('nav-open'))"><span></span><span></span><span></span></button>
      <div><div class="t-eyebrow">EC2 · Béton armé</div><div class="t-name">Outils de vérification</div></div>
    </div>
    <div class="view-wrap"><div id="view"></div></div>
  </main>
</div>

<!--
  Charge AVANT le script en ligne : les deux sont des scripts classiques et
  partagent la portee globale, donc `armatureMinimaleBridage` y est visible.
  Le passer en module casserait les `onclick` en ligne de la page.
-->
<script src="./asmin.js"></script>

<script>
"use strict";
const $ = id => document.getElementById(id);

/* =========================================================
   REGISTRE DES PAGES ET DU MENU
   Pour ajouter un outil : ecrire une fonction render(container),
   l'enregistrer dans PAGES, et ajouter une entree dans MENU.
   ========================================================= */
const PAGES = {
  accueil:     { title:"Accueil",                          render:renderAccueil },
  fissuration: { title:"Armature minimale de fissuration", render:renderFissuration },
  poteau:      { title:"Flambement de poteau",             render:c=>renderSoon(c,"Flambement de poteau","Instabilite","Methode de la rigidite nominale ou de la courbure nominale (EN 1992-1-1 §5.8) : elancement, effets du second ordre, moment amplifie.") },
};

/*
 * Les outils de la suite vivent dans des DEPOTS SEPARES, chacun avec sa propre
 * pile technique et sa propre adresse. Cette page les relie ; elle ne les
 * absorbe pas. Une entree de menu porte donc soit une route interne
 * (`["route","Libelle"]`), soit une adresse externe
 * (`{href:"…", label:"…"}`).
 */
const OUTILS_EXTERNES = {
  sectionUls:   "https://henri421.github.io/section-uls/",
  stm:          "https://henri421.github.io/STM/",
  poinconnement:"https://henri421.github.io/poinconnement/",
};

const MENU = [
  { group:null,                       items:[["accueil","Accueil"]] },
  { group:"Sections",                 items:[{href:OUTILS_EXTERNES.sectionUls, label:"Verification de sections"}] },
  { group:"Modeles bielle-tirant",    items:[{href:OUTILS_EXTERNES.stm, label:"Bielle-tirant"}] },
  { group:"Dalles",                   items:[{href:OUTILS_EXTERNES.poinconnement, label:"Poinconnement"}] },
  { group:"Fissuration & durabilité", items:[["fissuration","Armature minimale"]] },
  { group:"À venir",                  items:[["poteau","Flambement de poteau"]], soon:true },
];

function buildMenu(){
  const m=$("menu"); let h="";
  MENU.forEach(sec=>{
    if(sec.group) h+=`<div class="menu-group"><span class="menu-group-lbl">${sec.group}</span></div>`;
    sec.items.forEach(item=>{
      // Adresse externe : lien sortant, ouvert dans un nouvel onglet, signale
      // comme tel. L'utilisateur doit savoir qu'il quitte cette page.
      if(!Array.isArray(item)){
        h+=`<a class="item" href="${item.href}" target="_blank" rel="noopener">${item.label}</a>`;
        return;
      }
      const [route,label]=item;
      if(sec.soon){
        h+=`<span class="item disabled">${label}</span>`;
      }else{
        h+=`<a class="item" href="#${route}" data-route="${route}">${label}</a>`;
      }
    });
  });
  m.innerHTML=h;
}
function setActive(route){
  document.querySelectorAll("a.item").forEach(a=>{
    const on=a.dataset.route===route;
    a.classList.toggle("active",on);
    if(on)a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");
  });
}
/*
 * Le tiroir de navigation. Un seul chemin d'ouverture et de fermeture : la
 * classe sur `body`. L'etat de l'icone la suit, sinon un lecteur d'ecran
 * annoncerait un menu ferme alors qu'il est ouvert.
 */
function toggleNav(open){
  document.body.classList.toggle("nav-open",open);
  const b=$("hamb");
  if(b) b.setAttribute("aria-expanded", open?"true":"false");
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") toggleNav(false); });

function router(){
  const route = (location.hash.replace("#","")||"accueil");
  const page = PAGES[route] || PAGES.accueil;
  document.title = page.title + " · Béton armé EC2";
  const view=$("view"); view.innerHTML="";
  page.render(view);
  setActive(PAGES[route]?route:"accueil");
  toggleNav(false);
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",router);

/* =========================================================
   PAGE : ACCUEIL
   ========================================================= */
function renderAccueil(view){
  view.innerHTML = `
  <div class="page-h">
    <div>
      <div class="eyebrow">Suite d'outils · Eurocode 2</div>
      <h1>Vérifications de béton armé</h1>
      <div class="sub">Outils de calcul pour bureau d'études, exécutés localement dans le navigateur</div>
    </div>
  </div>

  <div class="hero">
    <p class="lead">Cette suite rassemble des outils de vérification selon l'<b>EN 1992-1-1</b>. Chaque outil expose la chaîne de calcul complète, avec les valeurs substituées, de sorte que la formule reste lisible derrière le résultat.</p>
    <p class="lead">Les outils sont <b>indépendants</b> : chacun a son dépôt, sa page et son rythme. Cette page les relie plutôt qu'elle ne les absorbe — ce qui laisse à chacun la pile technique qui lui convient. Les cartes marquées « outil séparé » ouvrent un nouvel onglet.</p>
  </div>

  <div class="toolgrid">
    <a class="tool-card" href="${OUTILS_EXTERNES.sectionUls}" target="_blank" rel="noopener">
      <div class="cat">Sections</div>
      <h3>Verification de sections</h3>

/* =========================================================
   PAGE : ARMATURE MINIMALE DE FISSURATION
   ========================================================= */
const F_IDS=["fck","s","t","mode","fcteff","kzt","methode","convK","fyk","sigsMode","sigsVal","phistar","h","b","c","phi","cas","wk","asprov","kt","k1","k2","k3","k4",
  // Champs de FORCAGE. Vides par defaut : un champ vide veut dire « calcule ».
  "impFctm","impFcteff","impD1","impHcef","impK","impKc","impAct","impAceff","impSigs"];

const F_DEF={fck:30,s:"0.25",t:3,mode:"impose",fcteff:2.9,kzt:0.8,methode:"din",convK:"ec2",fyk:500,sigsMode:"fyk",sigsVal:320,phistar:13.54,h:1000,b:1000,c:50,phi:12,cas:"traction",wk:0.3,asprov:8000,kt:0.4,k1:0.8,k2:1.0,k3:3.4,k4:0.425,
  // ⚠ CHAINES VIDES et non zeros : un « 0 » dans un champ de forcage serait
  // une valeur imposee a zero, ce qui annulerait l armature en silence.
  impFctm:"",impFcteff:"",impD1:"",impHcef:"",impK:"",impKc:"",impAct:"",impAceff:"",impSigs:""};
let fissState={};

const fmt=(x,d=2)=>(isFinite(x)?x.toLocaleString("fr-FR",{minimumFractionDigits:d,maximumFractionDigits:d}):"—");
const fmt0=x=>(isFinite(x)?Math.round(x).toLocaleString("fr-FR"):"—");

function renderFissuration(view){
  view.innerHTML = FISS_HTML;
  F_IDS.forEach(k=>{ const el=$(k); if(!el)return; el.value = (k in fissState)?fissState[k]:F_DEF[k]; });
  F_IDS.forEach(k=>{
    const el=$(k);
    el.addEventListener("input",()=>{ fissState[k]=el.value; fissRender(); });
  });
  $("cas").addEventListener("change",()=>{ $("k2").value=($("cas").value==="traction")?1.0:0.5; fissState.k2=$("k2").value; fissRender(); });
  buildBetonTable();
  fissRender();
}

function fissReadInputs(){
  const v={}; F_IDS.forEach(k=>{ const el=$(k); v[k]=(el.tagName==="SELECT")?el.value:parseFloat(el.value); }); return v;
}

function fissCompute(v){
  const r={};
  r.fcm=v.fck+8;
  r.fctm=v.fck<=50?0.30*Math.pow(v.fck,2/3):2.12*Math.log(1+r.fcm/10);
  r.bcc=Math.exp(parseFloat(v.s)*(1-Math.sqrt(28/v.t)));
  r.fctmt=(v.t<28?r.bcc:Math.pow(r.bcc,2/3))*r.fctm;
  r.fcteff=(v.mode==="auto")?r.fctmt:v.fcteff;
  // La chaine d'armature minimale vit dans asmin.js, testee contre le cas de
  // validation de SPEC_correction_Asmin_bridage.md §7. Ne pas la reecrire ici.
  //
  // Les champs de forcage : un champ VIDE veut dire « calcule », jamais zero.
  // `retenu()` dans asmin.js ignore les chaines vides et les NaN — et
  // `fissReadInputs` fait `parseFloat`, qui rend NaN sur un champ vide — donc
  // on peut les transmettre tels quels sans les filtrer ici.
  const impose = {
    fctm: v.impFctm, fcteff: v.impFcteff, d1: v.impD1, hcef: v.impHcef,
    k: v.impK, kc: v.impKc, Act: v.impAct, Aceff: v.impAceff, sigs: v.impSigs,
  };

  const am = armatureMinimaleBridage({
    h: v.h, b: v.b, cnom: v.c, phi: v.phi,
    fck: v.fck, fyk: v.fyk, Es: 200000,
    wk: v.wk, kzt: v.kzt, kc: (v.cas === "traction") ? 1.0 : 0.4,
    methode: v.methode,
    conventionK: v.convK,
    sollicitation: v.cas,
    // UN SEUL selecteur pour f_ct,eff, a quatre branches, plutot que deux
    // controles qui se recouvriraient. « impose » et « auto » fournissent la
    // valeur directement ; « kzt » et « tardif » la laissent calculer par
    // asmin.js, qui porte les deux regles.
    scenario: v.mode === "tardif" ? "tardif" : "jeune",
    ...(v.mode === "impose"
      ? { fcteffImpose: v.fcteff }
      : v.mode === "auto"
        ? { fcteffImpose: r.fctmt }
        : {}),
    ...(v.sigsMode === "phistar"
      ? { phiStar: v.phistar }
      : { sigs: (v.sigsMode === "fyk") ? v.fyk : v.sigsVal }),
    impose,
  });

  r.am = am;
  r.k = am.k;
  r.kc = am.kc;
  r.fctm = am.fctm;
  r.fcteff = am.fcteff;
  r.Act = am.Act;
  r.sigs = am.sigs;
  r.hcef = am.hcef;
  r.Asmin = am.AsMinceTotal;
  r.AsminFace = am.AsMinceParNappe;
  r.AsminThick = am.AsEpaisTotal;
  r.rho = am.AsMinTotal / (v.b * v.h);
  r.nZone = am.nappes;
  r.ActEff = am.nappes * am.Aceff;

  // La non-fragilite du §9.2.1.1 reste calculee ici : elle repond a une AUTRE
  // question — la resistance, pas la maitrise de la fissuration — et ne fait
  // pas partie de la chaine de bridage.
  r.d = v.h - v.c;
  r.Asnf = Math.max(0.26 * r.fctm / v.fyk, 0.0013) * v.b * r.d;
  r.Asgov = Math.max(am.AsMinTotal, r.Asnf);
  r.govWho = am.AsMinTotal >= r.Asnf ? "équation 7.1 (retrait gêné)" : "non-fragilité";
  r.AcEff = am.nappes * am.Aceff;
  r.rhoEff=v.asprov/r.AcEff;
  r.Nr=r.kc*r.k*r.fcteff*r.Act;
  r.sigsWk=r.Nr/v.asprov;
  r.Ecm=22000*Math.pow(r.fcm/10,0.3);
  r.ae=200000/r.Ecm;
  r.eps=Math.max((r.sigsWk-v.kt*r.fcteff/r.rhoEff*(1+r.ae*r.rhoEff))/200000, 0.6*r.sigsWk/200000);
  r.srmax=v.k3*v.c+v.k1*v.k2*v.k4*v.phi/r.rhoEff;
  r.wk=r.srmax*r.eps;
  r.ok=r.wk<=v.wk;
  return r;
}

function fissDraw(v,r){
  const svg=$("sec"); if(!svg)return;
  /* Un SVG genere en JS ne voit pas les variables CSS : les jetons sont lus une
     seule fois ici, puis passes en valeurs litterales aux attributs. Les
     valeurs de secours ne servent que si les proprietes personnalisees ne sont
     pas resolues (moteur sans support, environnement de test). */
  const cs=getComputedStyle(document.documentElement);
  const jeton=(nom,secours)=>(cs.getPropertyValue(nom)||"").trim()||secours;
  const ZONE_EFFECTIVE=jeton("--accent-doux","#eaf1f9"); // aplat de la zone tendue
  const CONTOUR=jeton("--texte","#1a1a1a");              // trait de section et barres
  const CONSTRUCTION=jeton("--accent","#1e5aa8");        // limite geometrique h_c,ef
  const COTE=jeton("--texte-doux","#4a4842");            // lignes et textes de cotation
  const MONO=jeton("--mono","ui-monospace,monospace");   // les cotes sont des nombres

  const W=640,H=360,padL=70,padR=44,padT=30,padB=50;
  const availW=W-padL-padR, availH=H-padT-padB;
  const sc=Math.min(availW/v.b, availH/v.h);
  const bw=v.b*sc, hh=v.h*sc, x0=padL+(availW-bw)/2, y0=padT+(availH-hh)/2;
  const cc=v.c*sc, hcefpx=r.hcef*sc, rphi=Math.max(2,(v.phi/2)*sc);
  const traction=v.cas==="traction";
  let g="";
  const rect=(x,y,w,h,fill,stroke,sw,dash)=>`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${fill}" stroke="${stroke||"none"}" stroke-width="${sw||0}" ${dash?`stroke-dasharray="${dash}"`:""}/>`;
  const line=(x1,y1,x2,y2,st,sw,dash)=>`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${st}" stroke-width="${sw||1}" ${dash?`stroke-dasharray="${dash}"`:""}/>`;
  const txt=(x,y,s,anc,col,sz)=>`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anc||"middle"}" fill="${col||CONTOUR}" font-family="${MONO}" font-size="${sz||11}">${s}</text>`;
  g+=rect(x0,y0+hh-hcefpx,bw,hcefpx,ZONE_EFFECTIVE);
  if(traction) g+=rect(x0,y0,bw,hcefpx,ZONE_EFFECTIVE);
  g+=rect(x0,y0,bw,hh,"none",CONTOUR,1.6);
  g+=line(x0,y0+hh-hcefpx,x0+bw,y0+hh-hcefpx,CONSTRUCTION,1,"4 3");
  if(traction) g+=line(x0,y0+hcefpx,x0+bw,y0+hcefpx,CONSTRUCTION,1,"4 3");
  const AsFace=traction?v.asprov/2:v.asprov;
  const barA=Math.PI*v.phi*v.phi/4;
  let n=Math.max(2,Math.round(AsFace/barA));
  const nDraw=Math.min(n,Math.max(2,Math.floor(bw/(2*rphi+4))));
  const face=yc=>{let s="";const us=bw-2*cc;for(let i=0;i<nDraw;i++){const x=x0+cc+(nDraw===1?us/2:us*i/(nDraw-1));s+=`<circle cx="${x.toFixed(1)}" cy="${yc.toFixed(1)}" r="${rphi.toFixed(1)}" fill="${CONTOUR}"/>`;}return s;};
  g+=face(y0+hh-cc);
  if(traction) g+=face(y0+cc);
  const dimX=x0-26;
  g+=line(dimX,y0,dimX,y0+hh,COTE,1)+line(dimX-4,y0,dimX+4,y0,COTE,1)+line(dimX-4,y0+hh,dimX+4,y0+hh,COTE,1);
  g+=`<text x="${(dimX-8).toFixed(1)}" y="${(y0+hh/2).toFixed(1)}" text-anchor="middle" fill="${COTE}" font-family="${MONO}" font-size="11" transform="rotate(-90 ${(dimX-8).toFixed(1)} ${(y0+hh/2).toFixed(1)})">h = ${fmt0(v.h)} mm</text>`;
  const dimY=y0+hh+24;
  g+=line(x0,dimY,x0+bw,dimY,COTE,1)+line(x0,dimY-4,x0,dimY+4,COTE,1)+line(x0+bw,dimY-4,x0+bw,dimY+4,COTE,1);
  g+=txt(x0+bw/2,dimY+14,`b = ${fmt0(v.b)} mm`,"middle",COTE,11);
  const bx=x0+bw+16;
  g+=line(bx,y0+hh-hcefpx,bx,y0+hh,CONSTRUCTION,1)+line(bx-4,y0+hh-hcefpx,bx+4,y0+hh-hcefpx,CONSTRUCTION,1)+line(bx-4,y0+hh,bx+4,y0+hh,CONSTRUCTION,1);
  g+=txt(bx+6,y0+hh-hcefpx/2+4,`h_c,ef=${fmt0(r.hcef)}`,"start",CONSTRUCTION,10);
  svg.innerHTML=g;
}

function fissRender(){
  const v=fissReadInputs(), r=fissCompute(v);
  const am=r.am;
  const nappe=am.nappes===2?" par nappe":"";
  /* Le suffixe « imposé » n'est PAS decoratif : c'est ce qui distingue une
     valeur que la chaine a calculee d'une valeur que l'ingenieur a forcee.
     Sans lui, une note de calcul presenterait les deux de la meme facon et ne
     serait verifiable par personne. */
  const marque=nom=>(am.sources[nom]==="impose"?" (imposé)":"");

  $("asmin").textContent=fmt0(am.AsMinceTotal);
  $("asminface").textContent=(v.cas==="traction")?`${fmt0(am.AsMinceParNappe)} mm²${nappe}`:"face tendue";
  $("asminthick").textContent=fmt0(am.AsEpaisTotal);
  $("asminborne").textContent=`zone de surface · borne ${fmt0(am.BorneTotal)} mm²`;
  $("asnf").textContent=fmt0(r.Asnf);
  $("asgov").textContent=fmt0(r.Asgov);
  $("govwho").textContent="→ "+r.govWho;

  $("approche").textContent=am.approcheRetenue==="epaisse"
    ?"approche ÉPAISSE — elle gouverne"
    :"approche MINCE — elle gouverne";
  $("asretenu").textContent=`${fmt0(am.AsMinParNappe)} mm²${nappe} · ${fmt0(am.AsMinTotal)} mm² au total`;
  $("referentiel").textContent=
    (am.methode==="ec2"?"texte EN 1992-1-1 §7.3.2(3)":"pratique allemande, branches h/d₁")
    +" · "+(am.conventionK==="de"?"k annexe allemande":"k EC2 recommandé");
  $("d1out").textContent=fmt0(am.d1)+" mm"+marque("d1");
  $("hcefout").textContent=fmt0(am.hcef)+" mm"+marque("hcef");
  $("fctmout").textContent=fmt(am.fctm,2)+" MPa"+marque("fctm");
  $("fcteffout").textContent=fmt(am.fcteff,2)+" MPa"+marque("fcteff");
  $("kout").textContent=fmt(am.k,3)+marque("k");
  $("kcout").textContent=fmt(am.kc,2)+marque("kc");
  $("actout").textContent=fmt0(am.Act)+" mm²"+marque("Act");
  $("aceffout").textContent=fmt0(am.Aceff)+" mm²"+marque("Aceff");
  $("sigsout").textContent=fmt(am.sigs,1)+" MPa"+marque("sigs");

  /* Les avertissements SIGNALENT, ils n'ecretent pas : ecreter retirerait a
     l'ingenieur la decision qu'il vient explicitement de prendre. */
  $("avertissements").innerHTML=am.avertissements.length===0?""
    :"<ul>"+am.avertissements.map(a=>"<li>"+a+"</li>").join("")+"</ul>";

  $("hcef").textContent=fmt0(r.hcef);
  $("aceff").textContent=fmt0(r.AcEff);
  $("rhoeff").textContent=fmt(r.rhoEff,4);
  $("sigsv").textContent=fmt0(r.sigsWk)+" MPa";
  $("eps").textContent=fmt(r.eps,6);
  $("srmax").textContent=fmt0(r.srmax);
  $("wkcalc").textContent=fmt(r.wk,3);
  $("wktgt").textContent=fmt(v.wk,2);
  const vb=$("verif"),chip=$("verifChip"),vd=$("verdict"),vdt=$("verdictTxt");
  if(r.ok){vb.className="verif ok";chip.textContent="✓ VÉRIFIÉ";vd.className="verdict v-ok";vdt.textContent=`w_k = ${fmt(r.wk,3)} ≤ ${fmt(v.wk,2)} mm`;}
  else{vb.className="verif no";chip.textContent="✗ NON VÉRIFIÉ";vd.className="verdict v-no";vdt.textContent=`w_k = ${fmt(r.wk,3)} > ${fmt(v.wk,2)} mm`;}
  if(r.sigsWk>v.fyk){chip.textContent="✗ σs > fyk — augmenter As,prov";vb.className="verif no";}
  fissDraw(v,r);
  fissSteps(v,r);
  window._state={v,r};
}

function fissSteps(v,r){
  const S=[];
  const row=(sym,expr,res)=>`<div class="step"><span class="sym">${sym}</span><span class="expr">${expr}</span><span class="res">${res}</span></div>`;
  const hd=t=>`<div class="step head">${t}</div>`;
  /* Meme marquage que dans le panneau : le detail du calcul doit dire, lui
     aussi, ce qui a ete impose — c'est lui qu'on relit pour verifier. */
  const marq=nom=>(r.am.sources[nom]==="impose"?" · IMPOSÉ":"");
  S.push(hd("A · Résistance en traction du béton"));
  S.push(row("f_cm","f_ck + 8 = "+fmt0(v.fck)+" + 8",fmt0(r.fcm)+" MPa"));
  S.push(row("f_ctm",v.fck<=50?`0,30 · ${fmt0(v.fck)}^(2/3)`:`2,12 · ln(1 + ${fmt(r.fcm,0)}/10)`,fmt(r.fctm,2)+" MPa"));
  S.push(row("β_cc(t)","exp{ "+v.s+" · [1 − √(28/"+fmt0(v.t)+")] }",fmt(r.bcc,3)));
  S.push(row("f_ctm(t)",(v.t<28?"β_cc":"β_cc^(2/3)")+" · f_ctm",fmt(r.fctmt,2)+" MPa"));
  S.push(row("f_ct,eff",{impose:"valeur imposée",auto:"= f_ctm(t)",kzt:`k_zt · f_ctm = ${fmt(v.kzt,2)} · ${fmt(r.fctm,2)}`,tardif:"max(f_ctm ; 3,0) — bridage tardif"}[v.mode]+marq("fcteff"),fmt(r.fcteff,2)+" MPa"));
  S.push(hd("B · Coefficients de l'équation 7.1"));
  S.push(row("k",(v.convK==="de"?"annexe allemande · ":"EC2 · ")+(v.h<=300?"h ≤ 300":(v.h>=800?"h ≥ 800":"interpolation"))+marq("k"),fmt(r.k,3)));
  S.push(row("k_c",(v.cas==="traction"?"traction pure":"flexion pure")+marq("kc"),fmt(r.kc,2)));
  S.push(row("A_ct",(v.cas==="traction"?"b · h":"b · h / 2")+marq("Act"),fmt0(r.Act)+" mm²"));
  S.push(row("d₁",("c + φ/2")+marq("d1"),fmt0(r.am.d1)+" mm"));
  S.push(row("h_c,ef",(v.methode==="ec2"?"texte EC2 · min(2,5·d₁ ; h/2)":`pratique allemande · h/d₁ = ${fmt(r.am.ratio,1)}`)+marq("hcef"),fmt0(r.hcef)+" mm"));
  S.push(row("A_c,ef","b · h_c,ef (une face)"+marq("Aceff"),fmt0(r.am.Aceff)+" mm²"));
  S.push(hd("C · Contrainte dans l'acier"));
  S.push(row("σ_s",{fyk:"= f_yk",val:"valeur imposée",phistar:`√(6·w_k·E_s·f_ct,eff / Ø*) = √(6·${fmt(v.wk,2)}·200000·${fmt(r.fcteff,2)} / ${fmt(v.phistar,2)})`}[v.sigsMode]+marq("sigs"),fmt(r.sigs,1)+" MPa"));
  S.push(hd("D · Armature minimale (éq. 7.1)"));
  S.push(row("A_s,min mince",`k_c·k·f_ct,eff·A_ct/σ_s = ${fmt(r.kc,1)}·${fmt(r.k,2)}·${fmt(r.fcteff,1)}·${fmt0(r.Act)}/${fmt0(r.sigs)}`,fmt0(r.am.AsMinceTotal)+" mm²"));
  S.push(row("A_s,min épais",`${r.am.nappes} · f_ct,eff·A_c,ef/σ_s — NI k NI k_c : ils reduisent l'effort a l'echelle de la section entiere, pas de la peau qui travaille`,fmt0(r.am.AsEpaisTotal)+" mm²"));
  S.push(row("borne","k·f_ct,eff·A_ct/f_yk — en deça, l'acier plastifie a la fissuration",fmt0(r.am.BorneTotal)+" mm²"));
  S.push(row("A_s,min retenu",`min(mince ; épais) — approche ${r.am.approcheRetenue}`,"<b>"+fmt0(r.am.AsMinTotal)+" mm² total · "+fmt0(r.am.AsMinParNappe)+" mm²"+(r.am.nappes===2?" par nappe":"")+"</b>"));
  S.push(row("ρ","A_s,min / (b·h)",fmt(r.rho*100,3)+" %"));
  S.push(hd("E · Non-fragilité (§9.2.1.1)"));
  S.push(row("d","h − c",fmt0(r.d)+" mm"));
  S.push(row("A_s,min,nf","max(0,26·f_ctm/f_yk ; 0,0013)·b·d",fmt0(r.Asnf)+" mm²"));
  S.push(hd("F · Élément épais — zone effective"));
  S.push(row("h_c,ef","min(2,5(h−d) ; h/2)",fmt0(r.hcef)+" mm"));
  S.push(row("A_ct,eff",(r.nZone===2?"2·":"")+"b·h_c,ef",fmt0(r.ActEff)+" mm²"));
  S.push(row("A_s,min,épais","k_c·k·f_ct,eff·A_ct,eff/σ_s","<b>"+fmt0(r.AsminThick)+" mm²</b>"));
  S.push(hd("G · Ouverture de fissure (éq. 7.8 – 7.11)"));
  S.push(row("N_r","k_c·k·f_ct,eff·A_ct",fmt0(r.Nr)+" N"));
  S.push(row("σ_s (wk)","N_r / A_s,prov",fmt0(r.sigsWk)+" MPa"));
  S.push(row("ρ_p,eff","A_s,prov / A_c,eff",fmt(r.rhoEff,4)));
  S.push(row("ε_sm−ε_cm","éq. 7.9 (plancher 0,6σ_s/E_s)",fmt(r.eps,6)));
  S.push(row("s_r,max","k_3·c + k_1·k_2·k_4·φ/ρ_p,eff",fmt0(r.srmax)+" mm"));
  S.push(row("w_k","s_r,max · (ε_sm−ε_cm)","<b>"+fmt(r.wk,3)+" mm</b>"));
  $("steps").innerHTML=S.join("");
}

function buildBetonTable(){
  const classes=[["C12/15",12],["C16/20",16],["C20/25",20],["C25/30",25],["C30/37",30],["C35/45",35],["C40/50",40],["C45/55",45],["C50/60",50]];
  let h=""; classes.forEach(([nm,fck])=>{const fcm=fck+8,fctm=0.30*Math.pow(fck,2/3),fctk=0.7*fctm,Ecm=22000*Math.pow(fcm/10,0.3);h+=`<tr><td class="l">${nm}</td><td>${fck}</td><td>${fcm}</td><td>${fmt(fctm,2)}</td><td>${fmt(fctk,2)}</td><td>${fmt0(Ecm)}</td></tr>`;});
  $("betonTbl").innerHTML=h;
}

function copySummary(btn){
  const {v,r}=window._state;
  const am=r.am;
  const nappe=am.nappes===2?" par nappe":"";
  /* La synthese copiee porte les MEMES marques que l'ecran. Une note qui
     presenterait une valeur forcee comme calculee ne serait verifiable par
     personne, et c'est ce texte-la qu'on colle dans un rapport. */
  const marq=nom=>(am.sources[nom]==="impose"?" [IMPOSÉ]":"");
  const avert=am.avertissements.length===0?""
    :"\n--------------------------------------------\nAVERTISSEMENTS\n"+am.avertissements.map(a=>"  ! "+a).join("\n");

  const t=`ARMATURE MINIMALE DE FISSURATION — EN 1992-1-1
Béton C${v.fck} · fct,eff=${fmt(am.fcteff,2)} MPa${marq("fcteff")} · fyk=${v.fyk} MPa
Section h=${v.h} b=${v.b} c=${v.c} φ=${v.phi} · ${v.cas==="traction"?"traction pure":"flexion pure"}
Méthode h_c,ef : ${am.methode==="ec2"?"texte EN 1992-1-1 §7.3.2(3)":"pratique allemande, branches h/d1"}
Convention de k : ${am.conventionK==="de"?"annexe allemande (0,80→0,50)":"EC2 recommandé (1,00→0,65)"}
--------------------------------------------
d1        = ${fmt0(am.d1)} mm${marq("d1")}
h_c,ef    = ${fmt0(am.hcef)} mm${marq("hcef")}
k · k_c   = ${fmt(am.k,3)}${marq("k")} · ${fmt(am.kc,2)}${marq("kc")}
A_ct      = ${fmt0(am.Act)} mm²${marq("Act")}
A_c,ef    = ${fmt0(am.Aceff)} mm² (une face)${marq("Aceff")}
σ_s       = ${fmt(am.sigs,1)} MPa${marq("sigs")}
--------------------------------------------
As,min approche mince  = ${fmt0(am.AsMinceTotal)} mm² total · ${fmt0(am.AsMinceParNappe)} mm²${nappe}
As,min approche épaisse = ${fmt0(am.AsEpaisTotal)} mm² total · ${fmt0(am.AsEpaisParNappe)} mm²${nappe}
  (borne anti-plastification ${fmt0(am.BorneTotal)} mm² total)
As,min RETENU (${am.approcheRetenue}) = ${fmt0(am.AsMinTotal)} mm² total · ${fmt0(am.AsMinParNappe)} mm²${nappe}
As,min (non-fragilité) = ${fmt0(r.Asnf)} mm²
As,min GOUVERNANT     = ${fmt0(r.Asgov)} mm² (${r.govWho})${avert}
--------------------------------------------
Vérification wk (As,prov=${v.asprov} mm²):
  sr,max = ${fmt0(r.srmax)} mm · εsm-εcm = ${fmt(r.eps,6)}
  wk = ${fmt(r.wk,3)} mm  /  wk,max = ${fmt(v.wk,2)} mm  →  ${r.ok?"VÉRIFIÉ":"NON VÉRIFIÉ"}
--------------------------------------------
Réserve : les branches de h_c,ef ne sont pas le texte de l'EN 1992-1-1
(§7.3.2(3) : min(2,5(h−d) ; (h−x)/3 ; h/2)) mais la pratique allemande.
k est un paramètre national. En BE et au LU, la justification réglementaire
reste l'EN 1992-1-1 et ses annexes NBN / ILNAS. Ø* est une entrée.`;
  navigator.clipboard.writeText(t).then(()=>flash(btn,"Synthèse copiée"),()=>flash(btn,"Copie impossible"));
}
function flash(btn,msg){const o=btn.textContent;btn.textContent=msg;setTimeout(()=>btn.textContent=o,1400);}
function resetFiss(){ fissState={}; F_IDS.forEach(k=>{$(k).value=F_DEF[k];}); fissRender(); }
