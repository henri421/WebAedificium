<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Béton armé · EC2 — Outils de vérification</title>
<style>
  :root{
    --paper:#F4F6F8; --panel:#FFFFFF; --ink:#14202E; --muted:#5B6773;
    --line:#D5DCE3; --line-strong:#B8C2CC; --blue:#1E5AA8; --blue-soft:#EAF1F9;
    --green:#1B7A4B; --green-soft:#E6F2EC; --red:#C0392B; --red-soft:#FBE9E7;
    --amber:#B7791F; --amber-soft:#FBF3E2;
    --mono:ui-monospace,"SF Mono","Cascadia Code","Roboto Mono",Consolas,"Liberation Mono",monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --nav:252px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;color:var(--ink);background:var(--paper);font-family:var(--sans);font-size:15px;line-height:1.5}

  /* ---------- App shell ---------- */
  .app{display:grid;grid-template-columns:var(--nav) 1fr;min-height:100vh}
  aside.nav{
    background:var(--panel);border-right:2px solid var(--ink);
    position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;
  }
  .brand{padding:20px 18px 16px;border-bottom:1px solid var(--line)}
  .brand .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);font-weight:600}
  .brand .name{font-size:17px;font-weight:700;letter-spacing:-.01em;margin-top:3px}
  .brand .desc{font-size:11.5px;color:var(--muted);margin-top:2px}
  nav.menu{padding:10px 0;flex:1}
  .menu-group{padding:12px 18px 4px}
  .menu-group-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
  a.item,span.item{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:8px 18px 8px 16px;font-size:13.5px;color:var(--ink);text-decoration:none;
    border-left:3px solid transparent;cursor:pointer;
  }
  a.item:hover{background:var(--paper)}
  a.item.active{background:var(--blue-soft);border-left-color:var(--blue);color:var(--blue);font-weight:600}
  a.item:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
  span.item.disabled{color:var(--line-strong);cursor:default}
  .tag{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:2px;background:var(--paper);color:var(--muted);border:1px solid var(--line)}
  .nav-foot{padding:14px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.45}

  main{min-width:0}
  .topbar{display:none}
  .view-wrap{max-width:1120px;margin:0 auto;padding:0 22px}

  main{background-image:
      linear-gradient(var(--line) 1px,transparent 1px),
      linear-gradient(90deg,var(--line) 1px,transparent 1px);
      background-size:22px 22px;background-position:-1px -1px}

  .page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;
    padding:22px 0 16px;border-bottom:2px solid var(--ink);margin-bottom:22px}
  .page-h .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-weight:600}
  .page-h h1{font-size:25px;margin:6px 0 2px;letter-spacing:-.01em;font-weight:700}
  .page-h .sub{color:var(--muted);font-size:13.5px}
  .verdict{font-family:var(--mono);font-size:12px;border:1.5px solid;border-radius:2px;padding:9px 13px;white-space:nowrap;font-weight:600}
  .verdict small{display:block;font-weight:400;font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
  .v-ok{color:var(--green);border-color:var(--green);background:var(--green-soft)}
  .v-no{color:var(--red);border-color:var(--red);background:var(--red-soft)}

  /* ---------- Accueil ---------- */
  .hero{padding:8px 0 4px}
  .hero .lead{font-size:16px;color:var(--ink);max-width:60ch}
  .toolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin:22px 0}
  .tool-card{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:3px;background:var(--panel);padding:16px;position:relative;transition:border-color .15s}
  a.tool-card:hover{border-color:var(--blue)}
  .tool-card .cat{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}
  .tool-card.soon .cat{color:var(--muted)}
  .tool-card h3{font-size:16px;margin:6px 0 4px;font-weight:600}
  .tool-card p{font-size:13px;color:var(--muted);margin:0}
  .tool-card .status{position:absolute;top:14px;right:14px;font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:2px}
  .tool-card .status.on{background:var(--green-soft);color:var(--green)}
  .tool-card .status.off{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
  .tool-card.soon{opacity:.85}

  /* ---------- shared building blocks (fissuration) ---------- */
  .grid{display:grid;grid-template-columns:340px 1fr;gap:22px;margin:0 0 22px}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:3px}
  .panel-h{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);
    background:var(--paper);border-bottom:1px solid var(--line);padding:9px 14px;font-weight:600;display:flex;align-items:center;gap:8px}
  .panel-h .num{color:var(--blue)}
  .panel-b{padding:12px 14px}
  .field{display:grid;grid-template-columns:1fr 96px;align-items:center;gap:8px;margin:8px 0}
  .field label{font-size:13px}
  .field .u{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:left;grid-column:2;margin-top:-4px}
  .field.stack{grid-template-columns:1fr}
  input[type=number],select{font-family:var(--mono);font-size:13.5px;color:var(--blue);font-weight:600;
    border:1px solid var(--line-strong);border-radius:2px;padding:6px 7px;width:100%;background:var(--blue-soft);text-align:right;-moz-appearance:textfield}
  select{text-align:left}
  input:focus,select:focus{outline:2px solid var(--blue);outline-offset:0;background:#fff}
  .note{font-size:11.5px;color:var(--muted);margin:2px 0 10px;line-height:1.35}
  .grp{border-top:1px dashed var(--line);margin-top:6px;padding-top:8px}
  .grp:first-child{border-top:0;margin-top:0;padding-top:0}
  .subh{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);font-weight:600;padding:0 0 4px}
  details.adv summary{cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 0}
  details.adv[open] summary{color:var(--ink)}

  .draw-wrap{background:var(--panel);border:1px solid var(--line);border-radius:3px;margin-bottom:22px}
  .draw-b{padding:6px}
  svg.section{display:block;width:100%;height:auto;background:
      linear-gradient(var(--line) 1px,transparent 1px),
      linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:16px 16px;border-radius:2px}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--muted);padding:8px 12px;border-top:1px solid var(--line)}
  .legend i{display:inline-block;width:11px;height:11px;margin-right:5px;vertical-align:-1px;border-radius:1px}

  .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  @media(max-width:520px){.cards{grid-template-columns:1fr}}
  .card{border:1px solid var(--line);border-radius:3px;padding:12px 14px;background:var(--panel)}
  .card .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .card .val{font-family:var(--mono);font-size:24px;font-weight:600;margin-top:2px;line-height:1.1}
  .card .val small{font-size:13px;color:var(--muted);font-weight:400}
  .card .x{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:3px}
  .card.gov{border-color:var(--blue);border-width:1.5px;background:var(--blue-soft)}
  .card.gov .val{color:var(--blue)}

  .verif{border:1.5px solid var(--line);border-radius:3px;overflow:hidden}
  .verif.ok{border-color:var(--green)} .verif.no{border-color:var(--red)}
  .verif-h{padding:10px 14px;font-family:var(--mono);font-size:12px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
  .verif.ok .verif-h{background:var(--green-soft);color:var(--green)}
  .verif.no .verif-h{background:var(--red-soft);color:var(--red)}
  .verif-b{padding:6px 14px 12px}
  .kv{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12.5px;padding:5px 0;border-bottom:1px dotted var(--line)}
  .kv:last-child{border-bottom:0}
  .kv .lab{color:var(--muted)} .kv .v{font-weight:600}

  details.deriv{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:3px}
  details.deriv summary{cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:11px 14px;font-weight:600;list-style:none}
  details.deriv summary::-webkit-details-marker{display:none}
  details.deriv summary::before{content:"▸ ";color:var(--blue)}
  details.deriv[open] summary::before{content:"▾ "}
  .deriv-b{padding:2px 14px 14px;border-top:1px solid var(--line)}
  .step{font-family:var(--mono);font-size:12.5px;padding:7px 0;border-bottom:1px dotted var(--line);display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:baseline}
  @media(max-width:600px){.step{grid-template-columns:1fr}}
  .step .sym{color:var(--blue);font-weight:600}
  .step .expr{color:var(--muted);word-break:break-word}
  .step .res{font-weight:600;text-align:right;white-space:nowrap}
  .step.head{grid-template-columns:1fr;border-bottom:1px solid var(--line-strong);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:10.5px;margin-top:8px;padding-bottom:4px}

  .ref{margin:22px 0}
  table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.5px;background:var(--panel)}
  th,td{border:1px solid var(--line);padding:5px 8px;text-align:center}
  th{background:var(--paper);font-weight:600;font-size:11px}
  td.l,th.l{text-align:left}
  caption{text-align:left;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:10px 0 6px}

  .foot{border-top:2px solid var(--ink);padding:18px 0 40px;color:var(--muted);font-size:12px;line-height:1.5;margin-top:22px}
  .foot b{color:var(--ink)}
  .tools{display:flex;gap:10px;margin:0 0 12px;flex-wrap:wrap}
  button.tool{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;
    border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);border-radius:2px;padding:7px 12px}
  button.tool:hover{background:var(--paper)} button.tool:focus-visible{outline:2px solid var(--blue)}

  .placeholder{border:1px dashed var(--line-strong);border-radius:3px;background:var(--panel);padding:34px 24px;text-align:center;margin:8px 0}
  .placeholder .big{font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .placeholder p{max-width:52ch;margin:10px auto 0;color:var(--muted);font-size:13.5px}

  .hamb{display:none}
  @media(max-width:820px){
    .app{grid-template-columns:1fr}
    aside.nav{position:fixed;left:0;top:0;width:var(--nav);z-index:40;transform:translateX(-100%);transition:transform .2s}
    body.nav-open aside.nav{transform:translateX(0)}
    .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30;background:var(--paper);
      border-bottom:2px solid var(--ink);padding:10px 16px}
    .topbar .t-name{font-weight:700;font-size:15px}
    .topbar .t-eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
    .hamb{display:inline-flex;flex-direction:column;gap:3px;background:none;border:1px solid var(--line-strong);border-radius:3px;padding:8px 9px;cursor:pointer}
    .hamb span{width:16px;height:2px;background:var(--ink);display:block}
    .scrim{display:none;position:fixed;inset:0;background:rgba(20,32,46,.35);z-index:35}
    body.nav-open .scrim{display:block}
    main{background-image:none}
  }

  @media print{
    .app{grid-template-columns:1fr}
    aside.nav,.topbar,.hamb,.scrim,.tools,button.tool,details.deriv,details.adv{display:none!important}
    main{background:none}
    .page-h,.foot{border-color:#000}
    input,select{border:0;background:none;padding:0}
  }
  @media(prefers-reduced-motion:no-preference){
    .card .val,.verif,.verdict,.tool-card{transition:.18s}
  }
</style>
</head>
<body>
<div class="app">
  <div class="scrim" onclick="toggleNav(false)"></div>

  <aside class="nav" id="nav">
    <div class="brand">
      <div class="eyebrow">EC2 · Béton armé</div>
      <div class="name">Outils de vérification</div>
      <div class="desc">Bureau d'études · Eurocode 2</div>
    </div>
    <nav class="menu" id="menu"></nav>
    <div class="nav-foot">
      Calculs exécutés localement, sans transmission de données. EN 1992-1-1:2004 + AC:2010.
    </div>
  </aside>

  <main>
    <div class="topbar">
      <button class="hamb" aria-label="Ouvrir le menu" onclick="toggleNav(true)"><span></span><span></span><span></span></button>
      <div><div class="t-eyebrow">EC2 · Béton armé</div><div class="t-name">Outils de vérification</div></div>
    </div>
    <div class="view-wrap"><div id="view"></div></div>
  </main>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);

/* =========================================================
   REGISTRE DES PAGES ET DU MENU
   Pour ajouter un outil : ecrire une fonction render(container),
   l'enregistrer dans PAGES, et ajouter une entree dans MENU.
   ========================================================= */
const PAGES = {
  accueil:     { title:"Accueil",                          render:renderAccueil },
  fissuration: { title:"Armature minimale de fissuration", render:renderFissuration },
  flexion:     { title:"Flexion simple",                   render:c=>renderSoon(c,"Flexion simple","Section rectangulaire","Verification d'une section en flexion simple a l'ELU : equilibre des efforts, bras de levier, section d'acier tendu, pivot A/B.") },
  poteau:      { title:"Flambement de poteau",             render:c=>renderSoon(c,"Flambement de poteau","Instabilite","Methode de la rigidite nominale ou de la courbure nominale (EN 1992-1-1 §5.8) : elancement, effets du second ordre, moment amplifie.") },
  tranchant:   { title:"Effort tranchant",                 render:c=>renderSoon(c,"Effort tranchant","Cisaillement","Verification a l'effort tranchant (§6.2) : beton seul VRd,c, treillis d'armatures VRd,s, bielle comprimee VRd,max.") },
};

const MENU = [
  { group:null,                       items:[["accueil","Accueil"]] },
  { group:"Fissuration & durabilité", items:[["fissuration","Armature minimale"]] },
  { group:"À venir",                  items:[["flexion","Flexion simple"],["poteau","Flambement de poteau"],["tranchant","Effort tranchant"]], soon:true },
];

function buildMenu(){
  const m=$("menu"); let h="";
  MENU.forEach(sec=>{
    if(sec.group) h+=`<div class="menu-group"><span class="menu-group-lbl">${sec.group}</span></div>`;
    sec.items.forEach(([route,label])=>{
      if(sec.soon){
        h+=`<span class="item disabled">${label}<span class="tag">à venir</span></span>`;
      }else{
        h+=`<a class="item" href="#${route}" data-route="${route}">${label}</a>`;
      }
    });
  });
  m.innerHTML=h;
}
function setActive(route){
  document.querySelectorAll("a.item").forEach(a=>{
    const on=a.dataset.route===route;
    a.classList.toggle("active",on);
    if(on)a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");
  });
}
function toggleNav(open){ document.body.classList.toggle("nav-open",open); }

function router(){
  const route = (location.hash.replace("#","")||"accueil");
  const page = PAGES[route] || PAGES.accueil;
  document.title = page.title + " · Béton armé EC2";
  const view=$("view"); view.innerHTML="";
  page.render(view);
  setActive(PAGES[route]?route:"accueil");
  toggleNav(false);
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",router);

/* =========================================================
   PAGE : ACCUEIL
   ========================================================= */
function renderAccueil(view){
  view.innerHTML = `
  <div class="page-h">
    <div>
      <div class="eyebrow">Suite d'outils · Eurocode 2</div>
      <h1>Vérifications de béton armé</h1>
      <div class="sub">Outils de calcul pour bureau d'études, exécutés localement dans le navigateur</div>
    </div>
  </div>

  <div class="hero">
    <p class="lead">Cette suite rassemble des outils de vérification selon l'<b>EN 1992-1-1</b>. Chaque outil expose la chaîne de calcul complète, avec les valeurs substituées, de sorte que la formule reste lisible derrière le résultat. Sélectionnez un module dans le menu ou parmi les cartes ci-dessous.</p>
  </div>

  <div class="toolgrid">
    <a class="tool-card" href="#fissuration">
      <span class="status on">Actif</span>
      <div class="cat">Fissuration & durabilité</div>
      <h3>Armature minimale de fissuration</h3>
      <p>Éléments massifs sous déformation gênée. Équation 7.1, réduction élément épais, vérification de l'ouverture de fissure.</p>
    </a>
    <span class="tool-card soon">
      <span class="status off">À venir</span>
      <div class="cat">Section</div>
      <h3>Flexion simple</h3>
      <p>Section rectangulaire à l'ELU : bras de levier, acier tendu, pivots.</p>
    </span>
    <span class="tool-card soon">
      <span class="status off">À venir</span>
      <div class="cat">Instabilité</div>
      <h3>Flambement de poteau</h3>
      <p>Effets du second ordre, élancement, moment amplifié (§5.8).</p>
    </span>
    <span class="tool-card soon">
      <span class="status off">À venir</span>
      <div class="cat">Cisaillement</div>
      <h3>Effort tranchant</h3>
      <p>V<sub>Rd,c</sub>, treillis d'armatures, bielle comprimée (§6.2).</p>
    </span>
  </div>

  <div class="foot" style="border-top:1px solid var(--line);margin-top:8px">
    <b>Extension.</b> Pour ajouter un outil, écrire une fonction <code>render(container)</code>, l'enregistrer dans l'objet <code>PAGES</code>, puis ajouter une entrée dans <code>MENU</code>. La navigation, l'onglet actif et le routage par ancre sont automatiques. L'architecture en fichier unique fonctionne en local comme sur GitHub Pages.
  </div>`;
}

/* =========================================================
   PAGE : PLACEHOLDER "À VENIR"
   ========================================================= */
function renderSoon(view,title,cat,desc){
  view.innerHTML=`
  <div class="page-h">
    <div><div class="eyebrow">${cat}</div><h1>${title}</h1><div class="sub">Module en préparation</div></div>
  </div>
  <div class="placeholder">
    <div class="big">Outil à venir</div>
    <p>${desc}</p>
    <p style="margin-top:14px"><a href="#accueil" style="color:var(--blue)">Retour à l'accueil</a></p>
  </div>`;
}

/* =========================================================
   PAGE : ARMATURE MINIMALE DE FISSURATION
   ========================================================= */
const F_IDS=["fck","s","t","mode","fcteff","fyk","sigsMode","sigsVal","h","b","c","phi","cas","wk","asprov","kt","k1","k2","k3","k4"];
const F_DEF={fck:30,s:"0.25",t:3,mode:"impose",fcteff:2.9,fyk:500,sigsMode:"fyk",sigsVal:320,h:1000,b:1000,c:50,phi:12,cas:"traction",wk:0.3,asprov:8000,kt:0.4,k1:0.8,k2:1.0,k3:3.4,k4:0.425};
let fissState={};

const fmt=(x,d=2)=>(isFinite(x)?x.toLocaleString("fr-FR",{minimumFractionDigits:d,maximumFractionDigits:d}):"—");
const fmt0=x=>(isFinite(x)?Math.round(x).toLocaleString("fr-FR"):"—");

function renderFissuration(view){
  view.innerHTML = FISS_HTML;
  F_IDS.forEach(k=>{ const el=$(k); if(!el)return; el.value = (k in fissState)?fissState[k]:F_DEF[k]; });
  F_IDS.forEach(k=>{
    const el=$(k);
    el.addEventListener("input",()=>{ fissState[k]=el.value; fissRender(); });
  });
  $("cas").addEventListener("change",()=>{ $("k2").value=($("cas").value==="traction")?1.0:0.5; fissState.k2=$("k2").value; fissRender(); });
  buildBetonTable();
  fissRender();
}

function fissReadInputs(){
  const v={}; F_IDS.forEach(k=>{ const el=$(k); v[k]=(el.tagName==="SELECT")?el.value:parseFloat(el.value); }); return v;
}

function fissCompute(v){
  const r={};
  r.fcm=v.fck+8;
  r.fctm=v.fck<=50?0.30*Math.pow(v.fck,2/3):2.12*Math.log(1+r.fcm/10);
  r.bcc=Math.exp(parseFloat(v.s)*(1-Math.sqrt(28/v.t)));
  r.fctmt=(v.t<28?r.bcc:Math.pow(r.bcc,2/3))*r.fctm;
  r.fcteff=(v.mode==="auto")?r.fctmt:v.fcteff;
  r.k=v.h<=300?1:(v.h>=800?0.65:1-(v.h-300)/500*0.35);
  r.kc=(v.cas==="traction")?1:0.4;
  r.Act=(v.cas==="traction")?v.b*v.h:v.b*v.h/2;
  r.sigs=(v.sigsMode==="fyk")?v.fyk:v.sigsVal;
  r.Asmin=r.kc*r.k*r.fcteff*r.Act/r.sigs;
  r.AsminFace=(v.cas==="traction")?r.Asmin/2:r.Asmin;
  r.rho=r.Asmin/(v.b*v.h);
  r.d=v.h-v.c;
  r.Asnf=Math.max(0.26*r.fctm/v.fyk,0.0013)*v.b*r.d;
  r.Asgov=Math.max(r.Asmin,r.Asnf);
  r.govWho=r.Asmin>=r.Asnf?"équation 7.1 (retrait gêné)":"non-fragilité";
  r.hcef=Math.min(2.5*(v.h-r.d),v.h/2);
  r.nZone=(v.cas==="traction")?2:1;
  r.ActEff=r.nZone*v.b*r.hcef;
  r.AsminThick=r.kc*r.k*r.fcteff*r.ActEff/r.sigs;
  r.AcEff=r.nZone*v.b*r.hcef;
  r.rhoEff=v.asprov/r.AcEff;
  r.Nr=r.kc*r.k*r.fcteff*r.Act;
  r.sigsWk=r.Nr/v.asprov;
  r.Ecm=22000*Math.pow(r.fcm/10,0.3);
  r.ae=200000/r.Ecm;
  r.eps=Math.max((r.sigsWk-v.kt*r.fcteff/r.rhoEff*(1+r.ae*r.rhoEff))/200000, 0.6*r.sigsWk/200000);
  r.srmax=v.k3*v.c+v.k1*v.k2*v.k4*v.phi/r.rhoEff;
  r.wk=r.srmax*r.eps;
  r.ok=r.wk<=v.wk;
  return r;
}

function fissDraw(v,r){
  const svg=$("sec"); if(!svg)return;
  const W=640,H=360,padL=70,padR=44,padT=30,padB=50;
  const availW=W-padL-padR, availH=H-padT-padB;
  const sc=Math.min(availW/v.b, availH/v.h);
  const bw=v.b*sc, hh=v.h*sc, x0=padL+(availW-bw)/2, y0=padT+(availH-hh)/2;
  const cc=v.c*sc, hcefpx=r.hcef*sc, rphi=Math.max(2,(v.phi/2)*sc);
  const traction=v.cas==="traction";
  let g="";
  const rect=(x,y,w,h,fill,stroke,sw,dash)=>`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${fill}" stroke="${stroke||"none"}" stroke-width="${sw||0}" ${dash?`stroke-dasharray="${dash}"`:""}/>`;
  const line=(x1,y1,x2,y2,st,sw,dash)=>`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${st}" stroke-width="${sw||1}" ${dash?`stroke-dasharray="${dash}"`:""}/>`;
  const txt=(x,y,s,anc,col,sz)=>`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anc||"middle"}" fill="${col||"#14202E"}" font-family="ui-monospace,monospace" font-size="${sz||11}">${s}</text>`;
  g+=rect(x0,y0+hh-hcefpx,bw,hcefpx,"#EAF1F9");
  if(traction) g+=rect(x0,y0,bw,hcefpx,"#EAF1F9");
  g+=rect(x0,y0,bw,hh,"none","#14202E",1.6);
  g+=line(x0,y0+hh-hcefpx,x0+bw,y0+hh-hcefpx,"#1E5AA8",1,"4 3");
  if(traction) g+=line(x0,y0+hcefpx,x0+bw,y0+hcefpx,"#1E5AA8",1,"4 3");
  const AsFace=traction?v.asprov/2:v.asprov;
  const barA=Math.PI*v.phi*v.phi/4;
  let n=Math.max(2,Math.round(AsFace/barA));
  const nDraw=Math.min(n,Math.max(2,Math.floor(bw/(2*rphi+4))));
  const face=yc=>{let s="";const us=bw-2*cc;for(let i=0;i<nDraw;i++){const x=x0+cc+(nDraw===1?us/2:us*i/(nDraw-1));s+=`<circle cx="${x.toFixed(1)}" cy="${yc.toFixed(1)}" r="${rphi.toFixed(1)}" fill="#14202E"/>`;}return s;};
  g+=face(y0+hh-cc);
  if(traction) g+=face(y0+cc);
  const dimX=x0-26;
  g+=line(dimX,y0,dimX,y0+hh,"#5B6773",1)+line(dimX-4,y0,dimX+4,y0,"#5B6773",1)+line(dimX-4,y0+hh,dimX+4,y0+hh,"#5B6773",1);
  g+=`<text x="${(dimX-8).toFixed(1)}" y="${(y0+hh/2).toFixed(1)}" text-anchor="middle" fill="#5B6773" font-family="ui-monospace,monospace" font-size="11" transform="rotate(-90 ${(dimX-8).toFixed(1)} ${(y0+hh/2).toFixed(1)})">h = ${fmt0(v.h)} mm</text>`;
  const dimY=y0+hh+24;
  g+=line(x0,dimY,x0+bw,dimY,"#5B6773",1)+line(x0,dimY-4,x0,dimY+4,"#5B6773",1)+line(x0+bw,dimY-4,x0+bw,dimY+4,"#5B6773",1);
  g+=txt(x0+bw/2,dimY+14,`b = ${fmt0(v.b)} mm`,"middle","#5B6773",11);
  const bx=x0+bw+16;
  g+=line(bx,y0+hh-hcefpx,bx,y0+hh,"#1E5AA8",1)+line(bx-4,y0+hh-hcefpx,bx+4,y0+hh-hcefpx,"#1E5AA8",1)+line(bx-4,y0+hh,bx+4,y0+hh,"#1E5AA8",1);
  g+=txt(bx+6,y0+hh-hcefpx/2+4,`h_c,ef=${fmt0(r.hcef)}`,"start","#1E5AA8",10);
  svg.innerHTML=g;
}

function fissRender(){
  const v=fissReadInputs(), r=fissCompute(v);
  $("asmin").textContent=fmt0(r.Asmin);
  $("asminface").textContent=(v.cas==="traction")?`${fmt0(r.AsminFace)} mm² par face`:"face tendue";
  $("asminthick").textContent=fmt0(r.AsminThick);
  $("asnf").textContent=fmt0(r.Asnf);
  $("asgov").textContent=fmt0(r.Asgov);
  $("govwho").textContent="→ "+r.govWho;
  $("hcef").textContent=fmt0(r.hcef);
  $("aceff").textContent=fmt0(r.AcEff);
  $("rhoeff").textContent=fmt(r.rhoEff,4);
  $("sigsv").textContent=fmt0(r.sigsWk)+" MPa";
  $("eps").textContent=fmt(r.eps,6);
  $("srmax").textContent=fmt0(r.srmax);
  $("wkcalc").textContent=fmt(r.wk,3);
  $("wktgt").textContent=fmt(v.wk,2);
  const vb=$("verif"),chip=$("verifChip"),vd=$("verdict"),vdt=$("verdictTxt");
  if(r.ok){vb.className="verif ok";chip.textContent="✓ VÉRIFIÉ";vd.className="verdict v-ok";vdt.textContent=`w_k = ${fmt(r.wk,3)} ≤ ${fmt(v.wk,2)} mm`;}
  else{vb.className="verif no";chip.textContent="✗ NON VÉRIFIÉ";vd.className="verdict v-no";vdt.textContent=`w_k = ${fmt(r.wk,3)} > ${fmt(v.wk,2)} mm`;}
  if(r.sigsWk>v.fyk){chip.textContent="✗ σs > fyk — augmenter As,prov";vb.className="verif no";}
  fissDraw(v,r);
  fissSteps(v,r);
  window._state={v,r};
}

function fissSteps(v,r){
  const S=[];
  const row=(sym,expr,res)=>`<div class="step"><span class="sym">${sym}</span><span class="expr">${expr}</span><span class="res">${res}</span></div>`;
  const hd=t=>`<div class="step head">${t}</div>`;
  S.push(hd("A · Résistance en traction du béton"));
  S.push(row("f_cm","f_ck + 8 = "+fmt0(v.fck)+" + 8",fmt0(r.fcm)+" MPa"));
  S.push(row("f_ctm",v.fck<=50?`0,30 · ${fmt0(v.fck)}^(2/3)`:`2,12 · ln(1 + ${fmt(r.fcm,0)}/10)`,fmt(r.fctm,2)+" MPa"));
  S.push(row("β_cc(t)","exp{ "+v.s+" · [1 − √(28/"+fmt0(v.t)+")] }",fmt(r.bcc,3)));
  S.push(row("f_ctm(t)",(v.t<28?"β_cc":"β_cc^(2/3)")+" · f_ctm",fmt(r.fctmt,2)+" MPa"));
  S.push(row("f_ct,eff",v.mode==="auto"?"= f_ctm(t)":"valeur imposée",fmt(r.fcteff,2)+" MPa"));
  S.push(hd("B · Coefficients de l'équation 7.1"));
  S.push(row("k",v.h<=300?"h ≤ 300":(v.h>=800?"h ≥ 800":"interpolation"),fmt(r.k,3)));
  S.push(row("k_c",v.cas==="traction"?"traction pure":"flexion pure",fmt(r.kc,2)));
  S.push(row("A_ct",v.cas==="traction"?"b · h":"b · h / 2",fmt0(r.Act)+" mm²"));
  S.push(hd("C · Contrainte dans l'acier"));
  S.push(row("σ_s",v.sigsMode==="fyk"?"= f_yk":"valeur imposée",fmt0(r.sigs)+" MPa"));
  S.push(hd("D · Armature minimale (éq. 7.1)"));
  S.push(row("A_s,min",`k_c·k·f_ct,eff·A_ct/σ_s = ${fmt(r.kc,1)}·${fmt(r.k,2)}·${fmt(r.fcteff,1)}·${fmt0(r.Act)}/${fmt0(r.sigs)}`,"<b>"+fmt0(r.Asmin)+" mm²</b>"));
  S.push(row("ρ","A_s,min / (b·h)",fmt(r.rho*100,3)+" %"));
  S.push(hd("E · Non-fragilité (§9.2.1.1)"));
  S.push(row("d","h − c",fmt0(r.d)+" mm"));
  S.push(row("A_s,min,nf","max(0,26·f_ctm/f_yk ; 0,0013)·b·d",fmt0(r.Asnf)+" mm²"));
  S.push(hd("F · Élément épais — zone effective"));
  S.push(row("h_c,ef","min(2,5(h−d) ; h/2)",fmt0(r.hcef)+" mm"));
  S.push(row("A_ct,eff",(r.nZone===2?"2·":"")+"b·h_c,ef",fmt0(r.ActEff)+" mm²"));
  S.push(row("A_s,min,épais","k_c·k·f_ct,eff·A_ct,eff/σ_s","<b>"+fmt0(r.AsminThick)+" mm²</b>"));
  S.push(hd("G · Ouverture de fissure (éq. 7.8 – 7.11)"));
  S.push(row("N_r","k_c·k·f_ct,eff·A_ct",fmt0(r.Nr)+" N"));
  S.push(row("σ_s (wk)","N_r / A_s,prov",fmt0(r.sigsWk)+" MPa"));
  S.push(row("ρ_p,eff","A_s,prov / A_c,eff",fmt(r.rhoEff,4)));
  S.push(row("ε_sm−ε_cm","éq. 7.9 (plancher 0,6σ_s/E_s)",fmt(r.eps,6)));
  S.push(row("s_r,max","k_3·c + k_1·k_2·k_4·φ/ρ_p,eff",fmt0(r.srmax)+" mm"));
  S.push(row("w_k","s_r,max · (ε_sm−ε_cm)","<b>"+fmt(r.wk,3)+" mm</b>"));
  $("steps").innerHTML=S.join("");
}

function buildBetonTable(){
  const classes=[["C12/15",12],["C16/20",16],["C20/25",20],["C25/30",25],["C30/37",30],["C35/45",35],["C40/50",40],["C45/55",45],["C50/60",50]];
  let h=""; classes.forEach(([nm,fck])=>{const fcm=fck+8,fctm=0.30*Math.pow(fck,2/3),fctk=0.7*fctm,Ecm=22000*Math.pow(fcm/10,0.3);h+=`<tr><td class="l">${nm}</td><td>${fck}</td><td>${fcm}</td><td>${fmt(fctm,2)}</td><td>${fmt(fctk,2)}</td><td>${fmt0(Ecm)}</td></tr>`;});
  $("betonTbl").innerHTML=h;
}

Section h=${v.h} b=${v.b} c=${v.c} φ=${v.phi} · ${v.cas==="traction"?"traction pure":"flexion pure"}
--------------------------------------------
As,min (éq.7.1)       = ${fmt0(r.Asmin)} mm²
